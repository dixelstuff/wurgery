<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5fb">
  <meta name="description" content="A little word surgery. Move some letters, snip some away, and find the word in the clue.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ctext y='38' font-size='38'%3E✂️%3C/text%3E%3C/svg%3E">
  <title>Wurgery</title>
  <link rel="stylesheet" href="style.css?v=forceps-label">
  <script type="module" src="app.mjs?v=levels20"></script>
</head>
<body>
  <main class="game">
    <header class="header">
      <h1>Wurgery<svg class="brand-mark" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6 1h4v5h5v4h-5v5H6v-5H1V6h5Z" /></svg></h1>
    </header>
    <nav class="puzzle-nav" aria-label="Puzzle navigation">
      <button id="previous" type="button" aria-label="Previous puzzle">‹</button>
      <span class="puzzle-label">Puzzle <span id="puzzle-number"></span><span id="puzzle-total"></span><span id="puzzle-completed" class="puzzle-completed" aria-label="Completed" hidden>✓</span></span>
      <button id="next" type="button" aria-label="Next puzzle">›</button>
    </nav>
    <p id="clue" class="clue">Loading…</p>
    <section class="play-area" aria-label="Word puzzle">
      <div id="word-board" class="word-board" role="group" aria-label="Puzzle letters"></div>
      <span id="selection-copy" class="sr-only" aria-live="polite"></span>
      <div id="operation-control" class="operation-control transplant locked" role="group" aria-label="Surgery control">
        <div id="transplant-indicator" class="transplant-indicator" role="group" aria-label="Transplant">
          <button id="move-left" class="direction" type="button" aria-label="Move selected chunk left" hidden>‹</button>
          <button id="place-transplant" class="place-transplant" type="button" aria-label="Transplant selected letters">
          <svg class="operation-icon" width="36" height="36" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="10" cy="8" r="4" />
            <circle cx="30" cy="8" r="4" />
            <path d="M12 12l13 19v4h-2M28 12 15 31v4h2" />
            <circle cx="20" cy="23" r="1.5" />
            <rect x="17" y="30" width="6" height="8" rx="1" fill="currentColor" fill-opacity=".22" />
          </svg>
          <span class="tool-label">Transplant</span>
          </button>
          <button id="move-right" class="direction" type="button" aria-label="Move selected chunk right" hidden>›</button>
        </div>
        <button id="scalpel" class="scalpel" type="button" aria-label="Excise selected letters" hidden><span class="operation-icon" aria-hidden="true">✂️</span><span class="tool-label">Excise</span></button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>
    </section>
    <div class="actions">
      <button id="reset" class="pill" type="button">Reset</button>
    </div>
    <p id="progress" class="progress"></p>
    <noscript>Enable JavaScript to play.</noscript>
  </main>
  <div id="drag-ghost" class="drag-ghost" aria-hidden="true" hidden></div>
</body>
</html>
